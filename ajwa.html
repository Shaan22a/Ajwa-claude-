<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajwa – Dry Fruits & Restaurant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;600;700&display=swap">
<style>
:root{--bg:#f7f3ea;--ink:#1d2a1a;--card:#fffdf7;--line:#e3dbc6;--green:#27401f;--gold:#c8902b;--brown:#4a2e1b;--mut:#6b6b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a11;--ink:#f1ead8;--card:#1c2619;--line:#2f3d2a;--green:#0d150b;--gold:#e0ab45;--brown:#e0c9a8;--mut:#a3a48e}}
:root[data-theme="dark"]{--bg:#131a11;--ink:#f1ead8;--card:#1c2619;--line:#2f3d2a;--green:#0d150b;--gold:#e0ab45;--brown:#e0c9a8;--mut:#a3a48e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--green);color:#f1ead8}
.logo{font-family:Marcellus,Georgia,serif;font-size:26px;letter-spacing:.06em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cartbtn{background:var(--gold);color:#1d1a0f;border:0;border-radius:99px;padding:8px 16px;font-weight:700}
.hero{background:var(--green);color:#f1ead8;padding:48px 20px 56px;text-align:center}
.hero h1{font-size:clamp(48px,12vw,104px);letter-spacing:.08em;line-height:1}
.hero p{max-width:34ch;margin:14px auto 28px;color:#d9d3bd;font-size:18px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.door{border:1px solid #c8902b88;background:#ffffff0f;color:#f1ead8;border-radius:14px;padding:18px 10px;text-align:center}
.door span{display:block;font-size:34px}
.door b{font-family:Marcellus,Georgia,serif;font-weight:400;font-size:20px}
.door[aria-selected=true]{background:var(--gold);color:#1d1a0f;border-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:28px 16px 90px}
.intro{color:var(--mut);margin:6px 0 20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px}
.chip[aria-pressed=true]{background:var(--green);color:#f1ead8;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.item .ico{font-size:42px}
.item h3{font-size:19px}
.item p{margin:0;color:var(--mut);font-size:14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:700;color:var(--brown)}
.add{background:var(--green);color:#f1ead8;border:0;border-radius:8px;padding:7px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.drawer{position:fixed;inset:0;z-index:10;display:none}
.drawer.open{display:block}
.scrim{position:absolute;inset:0;background:#0008}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
label{display:block;font-size:14px;font-weight:600;margin-top:8px}
input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 4px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--green);color:#f1ead8}
.total{display:flex;justify-content:space-between;font-size:20px;font-family:Marcellus,Georgia,serif}
.place{background:var(--gold);color:#1d1a0f;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:16px}
.err{color:#c0392b;font-size:14px;min-height:20px}
.done{text-align:center;padding:30px 6px}.done .ico{font-size:56px}
footer{text-align:center;color:var(--mut);padding:24px;font-size:14px}
.hero{position:relative;overflow:hidden}.hero>*:not(.float){position:relative;z-index:1}
.float{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;bottom:-90px;opacity:.3;animation:rise linear infinite}
.hero h1{background:linear-gradient(100deg,#f1ead8 30%,#e0ab45 50%,#f1ead8 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:open 1.4s ease-out,shine 4s linear infinite}
.door{transition:transform .2s,background .2s}.door:hover{transform:translateY(-4px)}
.door span{display:inline-block;animation:bob 3s ease-in-out infinite}
.door[aria-selected=true]{animation:glow 2.4s infinite}
.enter .item{animation:in .6s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--i)*60ms)}
.item{transition:transform .25s,box-shadow .25s}.item:hover{transform:translateY(-6px);box-shadow:0 12px 24px #0003}
.art{height:130px;display:grid;place-items:center;animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}
.art svg{width:124px;height:124px;transition:transform .3s}.item:hover .art svg{transform:scale(1.15) rotate(-6deg)}
.steam path{animation:steam 2.4s ease-in-out infinite}.steam path:nth-child(2){animation-delay:-1.2s}
.bub{animation:rise2 2s infinite}
.add{transition:transform .15s}.add:active{transform:scale(.9)}
.cartbtn.bump{animation:bump .4s}
.panel{animation:slide .35s cubic-bezier(.2,.8,.2,1)}.scrim{animation:fade .3s}
.done .ico{display:inline-block;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes rise{to{transform:translateY(-560px) rotate(360deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes open{from{letter-spacing:.4em;opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes glow{50%{box-shadow:0 0 22px #e0ab45aa}}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
@keyframes rise2{to{transform:translateY(-24px);opacity:0}}
@keyframes bump{40%{transform:scale(1.2)}}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top"><div class="logo">AJWA</div><button class="cartbtn" id="openCart">Cart (<span id="cnt">0</span>)</button></header>
<section class="hero">
<div class="float" id="float"></div>
<h1>Ajwa</h1>
<p>Premium dry fruits to take home. Fresh meals to eat now.</p>
<div class="doors" role="tablist">
<button class="door" role="tab" data-s="shop" aria-selected="true"><span>🌴</span><b>Dry Fruits</b></button>

<main>

<div class="chips" id="chips"></div>

<footer>Ajwa · Open daily 9 am – 11 pm</footer>

<div class="drawer" id="drawer"><div class="scrim" id="scrim"></div>
<div class="panel" role="dialog" aria-label="Your order" id="panel"></div></div>

function render(){
const d=DATA[sec];$("title").textContent=d.title;$("intro").textContent=d.intro;
const cats=["All",...new Set(d.items.map(i=>i[4]))];
$("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join("");
$("grid").className="grid"+(fresh?" enter":"");fresh=false;
$("grid").innerHTML=d.items.map((it,i)=>cat!="All"&&it[4]!=cat?"":`<div class="item" style="--i:${i}"><div class="art">${ART[it[0]]||it[1]}</div><h3>${it[0]}</h3><p>${it[2]}</p><div class="row"><span class="price">${money(it[3])}</span>${ctl(key(sec,i))}</div></div>`).join("");
document.querySelectorAll(".door").forEach(b=>b.setAttribute("aria-selected",b.dataset.s==sec));
const c=Object.values(cart).reduce((a,b)=>a+b,0);if(+$("cnt").textContent!=c){const b=$("openCart");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}$("cnt").textContent=c;}
function find(k){const[s,i]=k.split(":");const it=DATA[s].items[i];return{name:it[0],price:it[3],s}}
function ctl(k){return cart[k]?`<div class="qty"><button data-m="${k}" aria-label="Remove one">−</button><b>${cart[k]}</b><button data-p="${k}" aria-label="Add one">+</button></div>`:`<button class="add" data-p="${k}">Add</button>`}
function change(k,n){cart[k]=(cart[k]||0)+n;if(cart[k]<=0)delete cart[k];render();if($("drawer").classList.contains("open"))drawer()}
const subtotal=()=>Object.entries(cart).reduce((a,[k,q])=>a+find(k).price*q,0);
function drawer(err=""){
const ks=Object.keys(cart),p=$("panel"),close=`<button class="chip" id="close">Close</button>`;
if(step=="done"){p.innerHTML=`<div>${close}</div><div class="done"><div class="ico">✅</div><h2>One last step</h2><p>Your order is ready in WhatsApp. Tap <b>Send</b> there to confirm it with Ajwa.</p><p><a class="place" style="display:block;text-decoration:none" href="${waUrl}" target="_blank" rel="noopener">Open WhatsApp</a></p></div>`;$("close").onclick=()=>{step="cart";$("drawer").classList.remove("open")};return}
if(!ks.length){p.innerHTML=`<div>${close}</div><h2>Your cart is empty</h2><p class="intro">Add dry fruits or a meal to get started.</p>`;$("close").onclick=shut;return}
const fee=mode=="Delivery"?3:0;
p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Your order</h2>${close}</div>`+
ks.map(k=>{const f=find(k);return`<div class="line"><div>${f.name}<br><small class="intro">${money(f.price)} · ${f.s=="shop"?"Dry fruits":"Restaurant"}</small></div><div class="qty"><button data-m="${k}" aria-label="Remove one">−</button><b>${cart[k]}</b><button data-p="${k}" aria-label="Add one">+</button></div></div>`}).join("")+
`<label>How do you want it?</label><div class="seg">${["Pickup","Delivery","Dine in"].map(m=>`<button data-mode="${m}" aria-pressed="${m==mode}">${m}</button>`).join("")}</div>
<label for="n">Name</label><input id="n" autocomplete="name">
<label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel">
${mode=="Delivery"?`<label for="ad">Delivery address</label><textarea id="ad" rows="2"></textarea>`:""}
<label for="nt">Notes (optional)</label><input id="nt" placeholder="Allergies, spice level…">
<div class="line"><span>Subtotal</span><span>${money(subtotal())}</span></div>
${fee?`<div class="line"><span>Delivery</span><span>${money(fee)}</span></div>`:""}
<div class="total"><span>Total</span><span>${money(subtotal()+fee)}</span></div>
<div class="err" id="err">${err}</div><button class="place" id="place">Place order</button>`;
$("close").onclick=shut;
$("place").onclick=()=>{const n=$("n").value.trim(),ph=$("ph").value.trim(),ad=$("ad")?$("ad").value.trim():"x";
if(!n||ph.length<6||!ad){$("err").textContent="Enter your name, a phone number"+(mode=="Delivery"?" and delivery address.":".");return}
const nt=$("nt").value.trim();
const lines=Object.entries(cart).map(([k,q])=>`• ${find(k).name} x${q} = ${money(find(k).price*q)}`).join("\n");
const msg=`New order – Ajwa\n\n${lines}\n\nType: ${mode}\nTotal: ${money(subtotal()+fee)}\n\nName: ${n}\nPhone: ${ph}`+(mode=="Delivery"?`\nAddress: ${ad}`:"")+(nt?`\nNotes: ${nt}`:"");
waUrl="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
cart={};step="done";render();drawer();window.open(waUrl,"_blank")}}
function shut(){$("drawer").classList.remove("open")}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.s){sec=t.dataset.s;cat="All";fresh=true;render()}
else if(t.dataset.c){cat=t.dataset.c;fresh=true;render()}
else if(t.dataset.p)change(t.dataset.p,1);
else if(t.dataset.m)change(t.dataset.m,-1);
else if(t.dataset.mode){const v=[$("n"),$("ph"),$("nt")].map(x=>x.value);mode=t.dataset.mode;drawer();[$("n"),$("ph"),$("nt")].forEach((x,i)=>x.value=v[i])}});
$("openCart").onclick=()=>{step="cart";drawer();$("drawer").classList.add("open")};
$("scrim").onclick=shut;
render();
$("float").innerHTML=["Ajwa Dates","Almonds","Figs","Pistachios","Sukkari Dates","Walnuts","Dried Apricots","Cashews"].map((k,i)=>`<div class="fl" style="left:${6+i*12}%;width:${46+(i%3)*14}px;animation-duration:${9+i%4*3}s;animation-delay:${-i*2.2}s">${ART[k]}</div>`).join("");
</script></body></html>
